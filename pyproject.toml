[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-audio-frame-chunker"
version = "0.1.0"
description = "Low-latency sliding-window audio stream segmenter with Voice Activity Detection (VAD) for streaming voice agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
multimodal-audio-frame-chunker = "multimodal_audio_frame_chunker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multimodal_audio_frame_chunker*"]
